[project]
name = "xdoc-qa"
version = "0.1.0"
description = "Cross-document question generation from long PDFs"
requires-python = ">=3.11"
dependencies = [
    # step 1: PDF conversion
    "pymupdf>=1.24",
    "numpy>=1.26",
    "wordfreq>=3.1",
    # OCR engine, pip-only (no system install needed). Two packages, same models:
    "rapidocr-onnxruntime>=1.4; python_version < '3.13'",   # models shipped in the package
    "rapidocr>=3.0; python_version >= '3.13'",              # models downloaded on first use
    "onnxruntime>=1.18; python_version >= '3.13'",
    # step 2: document structure
    "pageindex>=0.2.19",
    "python-dotenv>=1.0",
    # step 3: cleaning and semantic chunking
    "pyyaml>=6.0",
    "litellm>=1.97",
    # step 4: graph database
    "neo4j>=5.20",
    # step 5: similarity
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xdocqa"]